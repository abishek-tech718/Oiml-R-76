services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: r76_certiscale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d r76_certiscale"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/r76_certiscale
      JWT_SECRET: change-this-for-any-shared-environment
      SEED_ADMIN_PASSWORD: change-this-local-admin-password
      REPORT_OUTPUT_DIR: ./generated-reports
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run migrate:db && npm run api"
    volumes:
      - reports_data:/app/backend/generated-reports

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  reports_data:
