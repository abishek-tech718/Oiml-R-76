services:
  - type: web
    name: r76-certiscale
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run migrate:db && npm run api
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: r76-certiscale-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: ROLE_SELECTOR_ENABLED
        value: true
      - key: REPORT_OUTPUT_DIR
        value: ./generated-reports

databases:
  - name: r76-certiscale-db
    plan: free
    region: singapore
